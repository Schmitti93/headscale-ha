name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - run: pip install pytest==9.2.0 pytest-asyncio==1.5.0 aiohttp==3.14.5 ruff==0.17.5 mypy==2.4.1 bandit==1.9.4 detect-secrets==1.5.0
      - run: pytest -q
      - run: ruff check .
      - run: mypy custom_components/headscale_monitor
      - run: bandit -q -r custom_components/headscale_monitor
      - run: python scripts/check_secrets.py
      - run: python scripts/prove_detect_secrets_fail_closed.py
      - run: docker compose -f docker-compose.test.yml config --quiet
