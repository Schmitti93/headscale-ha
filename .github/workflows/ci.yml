name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest pytest-asyncio aiohttp ruff mypy bandit detect-secrets
      - run: pytest -q
      - run: ruff check .
      - run: mypy custom_components/headscale_monitor
      - run: bandit -q -r custom_components/headscale_monitor
      - run: detect-secrets scan --baseline .secrets.baseline --all-files
