name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install pytest pytest-asyncio aiohttp ruff mypy bandit detect-secrets
      - run: pytest -q
      - run: ruff check .
      - run: mypy custom_components/headscale_monitor
      - run: bandit -q -r custom_components/headscale_monitor
      - run: python scripts/check_secrets.py
      - run: python scripts/prove_detect_secrets_fail_closed.py
      - run: docker compose -f docker-compose.test.yml config --quiet
