name: Marketplace validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run HACS validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CATEGORY: integration
          INPUT_COMMENT: "false"
          INPUT_REPOSITORY: ${{ github.repository }}
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/github/workspace"
          -e GITHUB_TOKEN -e INPUT_GITHUB_TOKEN
          -e GITHUB_REPOSITORY -e GITHUB_EVENT_NAME -e GITHUB_SHA
          -e GITHUB_WORKSPACE=/github/workspace
          -e INPUT_CATEGORY -e INPUT_COMMENT -e INPUT_REPOSITORY
          ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Hassfest
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/github/workspace"
          ghcr.io/home-assistant/hassfest@sha256:da6522993280166fe072704989a2b4c33e639e8ceb69c8ab6ad7ec5045c1a1e3
