[project]
name="headscale-ha"
version="0.2.1"
requires-python=">=3.12"
[tool.pytest.ini_options]
pythonpath=["."]
asyncio_mode="auto"
asyncio_default_fixture_loop_scope="function"
testpaths=["tests"]
[tool.ruff]
line-length=100
[tool.ruff.lint]
select=["E","F","I","B","S","UP"]
ignore=["S101"]
[tool.mypy]
python_version="3.12"
ignore_missing_imports=true
check_untyped_defs=true
