server {
    listen 8443 ssl;
    server_name headscale-mock;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /version {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{"version":"0.29.3"}';
    }

    location = /api/v1/node {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{"nodes":[{"id":1,"name":"isolated-mock","online":true,"ip_addresses":["100.64.0.1"]}]}';
    }

    location / { return 404; }
}
