server {
    listen 8443 ssl;
    server_name headscale-mock;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /version {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{"version":"0.29.3"}';
    }

    location = /api/v1/node {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{"nodes":[{"id":"1","name":"isolated-mock","online":true,"ipAddresses":["100.64.0.1"],"approvedRoutes":[],"availableRoutes":[],"subnetRoutes":[],"tags":[],"user":{"displayName":"Test User"}}]}';
    }

    location = /api/v1/user {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{"users":[{"id":"1","displayName":"Test User"}]}';
    }

    location = /api/v1/preauthkey {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{"preAuthKeys":[]}';
    }

    location = /api/v1/apikey {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{"apiKeys":[]}';
    }

    location = /api/v1/policy {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{"policy":"{}","updatedAt":"2026-11-14T00:00:00Z"}';
    }

    location = /api/v1/health {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{"databaseConnectivity":true}';
    }

    location = /api/v1/auth/approve {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{}';
    }

    location = /api/v1/auth/reject {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{}';
    }

    location ~ ^/api/v1/node/[0-9]+/approve_routes$ {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{"node":{"id":"1"}}';
    }

    location ~ ^/api/v1/node/[0-9]+/rename/[^/]+$ {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{"node":{"id":"1"}}';
    }

    location ~ ^/api/v1/node/[0-9]+/tags$ {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{"node":{"id":"1"}}';
    }

    location ~ ^/api/v1/node/[0-9]+/expire$ {
        if ($http_authorization != "Bearer integration-test") { return 401; }
        default_type application/json;
        return 200 '{"node":{"id":"1"}}';
    }

    location / { return 404; }
}
